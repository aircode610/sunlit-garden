# Local development services. Start: `docker compose up -d`   Stop: `docker compose down`
# Wipe all local data: `docker compose down -v`
# Run `scripts/dev-env.sh` once first to create .env with generated secrets.
#
# Versions are pinned: bump them deliberately, in a PR, and keep CI on the same tags.
# Ports are bound to 127.0.0.1 so nothing is reachable from your network.

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images keep data under a versioned subfolder of this path,
      # which makes future major-version upgrades (pg_upgrade) easier.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  garage:
    image: dxflrs/garage:v2.5.0
    # --single-node: configure a one-node cluster automatically.
    # --default-bucket: create GARAGE_DEFAULT_BUCKET and an access key for it from the env.
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET}
    ports:
      - "127.0.0.1:${S3_PORT:-3900}:3900" # S3 API
      - "127.0.0.1:${GARAGE_ADMIN_PORT:-3903}:3903" # admin API
    volumes:
      - ./infra/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
  garage-meta:
  garage-data:
