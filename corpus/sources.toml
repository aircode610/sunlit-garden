# --------------------------------------------------------------------------- documents

# Berkeley, Principles — the v0 milestone's spine (§3, esse est percipi).
[[document]]
provider = "gutenberg"
provider_id = "4723"
url = "https://www.gutenberg.org/cache/epub/4723/pg4723.txt"
licence = "public-domain-us"
media_type = "text/plain; charset=utf-8"
sha256 = "ba577d0e3437d92faeb6fedc01715e4703ee8ae3f94b4ccb0eb5c772508c3f93" # reviewed 2026-11-11

[[document.edition]]
work = "george-berkeley/principles-of-human-knowledge"
slug = "gutenberg-4723"
title = "A Treatise Concerning the Principles of Human Knowledge"
language = "en"

# The main part's heading has no "PART" word; scholars cite it as Part I (PHK 1.3 = §3).
[[document.edition.heading]]
text = "OF THE PRINCIPLES OF HUMAN KNOWLEDGE"
kind = "part"
label = "I"
slug = "part-1"

# This edition's bracketed notes, note markers and "[Vide sect. …]" cross-references are the
# editor's (signed "--Ed.", "--Edit 1710"), never Berkeley's words.
[[document.edition.insertion]]
prefix = "[Note"
by = "editor"

[[document.edition.insertion]]
prefix = "[Vide"
by = "editor"

# From the printed book: Introduction §§1–25, Part I §§1–156.
[document.edition.expect]
divisions = ["dedication", "preface", "introduction", "part-1"]
text_passages = { "introduction" = 25, "part-1" = 156 }

# Hume, Dialogues — the key critic (design: Parts II–VIII; evil: X–XI).
[[document]]
provider = "gutenberg"
provider_id = "4583"
url = "https://www.gutenberg.org/cache/epub/4583/pg4583.txt"
licence = "public-domain-us"
media_type = "text/plain; charset=utf-8"
sha256 = "a6e4592ad61467f6e2722207bb07450aca8e81835e67d07401ac47026f36af42" # reviewed 2026-11-11

[[document.edition]]
work = "david-hume/dialogues-concerning-natural-religion"
slug = "gutenberg-4583"
title = "Dialogues Concerning Natural Religion"
language = "en"

# The prefatory letter's heading isn't a standard heading word.
[[document.edition.heading]]
text = "PAMPHILUS TO HERMIPPUS"
kind = "letter"
label = "Pamphilus to Hermippus"
slug = "pamphilus-to-hermippus"

# Bracketed text in this edition is Hume's own source references (his original footnotes,
# printed inline), so it stays part of his words.
[[document.edition.insertion]]
prefix = "["
by = "author"

# Prefatory letter + Parts 1–12; paragraphs per Part counted from this edition.
[document.edition.expect]
divisions = ["pamphilus-to-hermippus", "part-1", "part-2", "part-3", "part-4", "part-5", "part-6", "part-7", "part-8", "part-9", "part-10", "part-11", "part-12"]
text_passages = { "pamphilus-to-hermippus" = 6, "part-1" = 22, "part-2" = 28, "part-3" = 13, "part-4" = 14, "part-5" = 17, "part-6" = 13, "part-7" = 18, "part-8" = 12, "part-9" = 11, "part-10" = 41, "part-11" = 21, "part-12" = 35 }
