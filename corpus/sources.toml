# Sunlit Garden — the source list (M0 Library).
#
# Hand-curated. Every document's sha256 is pinned: the importer refuses a download that
# doesn't match, so the corpus can be rebuilt byte-for-byte anywhere. To add a source, list it
# without `sha256`, run `sunlit import`, review the file it reports, then pin the hash it printed.
#
#   [[thinker]]           a person (slug = their URL name; wikidata = identity anchor)
#   [[work]]              an abstract work, by `thinker = "<slug>"`
#   [[document]]          one downloadable file (HTTPS), with its pinned sha256
#   [[document.edition]]  one work inside that file, `work = "<thinker>/<work>"`;
#                         Gutenberg files default to the text between the START/END markers,
#                         other providers need `range = { start = …, end = … }` (byte offsets)
#
# Wikidata ids verified against wikidata.org on 2026-11-11.

