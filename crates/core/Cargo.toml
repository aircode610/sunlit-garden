[package]
# Not plain `core`: that name is taken by Rust's built-in `core` crate.
name = "sunlit-core"
version.workspace = true
edition.workspace = true

[dependencies]
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "migrate", "time"] }
time = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
